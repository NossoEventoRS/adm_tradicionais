<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="robots" content="noindex, nofollow">
<title>Painel Administrativo – Danças Tradicionais</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, Helvetica, sans-serif;
  background: #93d688;
  margin: 0;
  padding: 0;
  color: #030303;
}

/* ---------- Login ---------- */
#telaLogin {
  max-width: 400px;
  width: 90%;
  margin: 80px auto;
  background: #fff;
  padding: 20px;
  border: 2px solid #3d6b35;
  text-align: center;
  border-radius: 8px;
}
#telaLogin img { max-width: 100%; height: auto; }
#telaLogin input {
  width: 90%;
  padding: 10px;
  margin: 10px 0;
  border: 1px solid #6a9161;
  border-radius: 4px;
  font-size: 16px;
}
#msgLogin { color: #a32a24; font-size: 14px; min-height: 18px; margin: 4px 0 8px; }

.btn {
  background: #5f9553;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 10px 18px;
  cursor: pointer;
  font-weight: bold;
  font-size: 14px;
  transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
}
.btn:hover { background: #4a7a41; transform: translateY(-1px); box-shadow: 0 4px 10px rgba(74,122,65,.35); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.claro { background: #fff; color: #345c2c; border: 2px solid #4a7a41; }
.btn.claro:hover { background: #eef6ec; }
.btn.pequeno { padding: 5px 10px; font-size: 12px; }
#btnEntrar { padding: 10px 40px; font-size: 16px; }

/* ---------- App ---------- */
#app { display: none; max-width: 1500px; width: 98%; margin: 10px auto; }

.topo {
  background: #fff;
  border-bottom: 3px solid #4a7a41;
  padding: 10px;
  display: grid;
  grid-template-columns: 90px 1fr auto;
  gap: 10px;
  align-items: center;
  border-radius: 6px 6px 0 0;
}
.topo img { height: 60px; max-width: 100%; }
.topo .titulo { text-align: center; line-height: 1.4; }
.topo .usuario { text-align: right; font-size: 13px; line-height: 1.6; }
.selo {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: bold;
  color: #fff;
}
.selo.edita { background: #4a7a41; }
.selo.vista { background: #7a6a2c; }

.painel { background: #fff; padding: 10px; border-radius: 0 0 6px 6px; }

.barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.barra select, .barra input[type="text"] {
  padding: 8px;
  border: 1px solid #6a9161;
  border-radius: 4px;
  font-size: 14px;
  background: #fff;
}
.barra .busca { flex: 1 1 220px; min-width: 160px; }
.espaco { flex: 1 1 auto; }
#resumo { font-size: 13px; color: #345c2c; }

.tabela-wrap {
  overflow: auto;
  max-height: 68vh;
  border: 1px solid #cfd9cb;
  border-radius: 4px;
}
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { border-bottom: 1px solid #e3eae0; padding: 6px 8px; text-align: left; white-space: nowrap; }
th {
  position: sticky;
  top: 0;
  background: #4a7a41;
  color: #fff;
  z-index: 2;
}
tbody tr:nth-child(even) td { background: #f5faf4; }
tbody tr:hover td { background: #e4f1e1; }
td.acao, th.acao { position: sticky; left: 0; z-index: 1; background: #fff; }
th.acao { z-index: 3; background: #345c2c; }
tbody tr:nth-child(even) td.acao { background: #f5faf4; }
td.longo { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }

.mais { text-align: center; margin: 10px 0 2px; }
.aviso-corte { font-size: 12px; color: #7a5a00; margin-top: 6px; }

/* ---------- Janelas ---------- */
.modal-fundo {
  position: fixed;
  inset: 0;
  background: rgba(20, 45, 18, .6);
  display: none;
  align-items: flex-start;
  justify-content: center;
  overflow-y: auto;
  padding: 14px;
  z-index: 9000;
}
.modal {
  background: #fff;
  border-radius: 8px;
  border: 2px solid #3d6b35;
  width: 100%;
  max-width: 820px;
  padding: 18px;
  margin: 16px auto;
}
.modal h2 { margin: 0 0 10px; color: #345c2c; border-bottom: 2px solid #4a7a41; padding-bottom: 6px; font-size: 18px; }
.grade { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px 14px; }
.campo { display: flex; flex-direction: column; min-width: 0; }
.campo.inteiro { grid-column: 1 / -1; }
.campo label { font-size: 12px; font-weight: bold; color: #345c2c; margin-bottom: 3px; }
.campo input, .campo select, .campo textarea {
  width: 100%;
  padding: 7px;
  border: 1px solid #6a9161;
  border-radius: 4px;
  font-size: 14px;
  font-family: inherit;
}
.campo textarea { min-height: 90px; resize: vertical; }
.campo .leitura {
  padding: 7px;
  background: #eef2ec;
  border: 1px solid #d5ded2;
  border-radius: 4px;
  font-size: 14px;
  min-height: 33px;
  overflow-wrap: anywhere;
}
.campo.editavel label::after { content: " ✎"; color: #4a7a41; }
.nota-modal { font-size: 12px; color: #555; margin: 8px 0; line-height: 1.5; }
.rodape-modal { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.msg { font-size: 14px; min-height: 18px; margin-top: 8px; white-space: pre-line; }
.msg.erro { color: #a32a24; }
.msg.ok { color: #1f6b2a; }
.chk { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; font-size: 14px; }
.chk input { width: 18px; height: 18px; margin-top: 1px; flex: 0 0 auto; }
.chk.desab { opacity: .55; }

.progresso { height: 14px; background: #dfe9dc; border-radius: 7px; overflow: hidden; margin-top: 12px; display: none; }
.progresso > div { height: 100%; width: 0; background: #4a7a41; transition: width .3s; }

@media (max-width: 760px) {
  .topo { grid-template-columns: 1fr; text-align: center; }
  .topo img { margin: 0 auto; }
  .topo .usuario { text-align: center; }
  .grade { grid-template-columns: 1fr; }
  .barra select, .barra .btn { flex: 1 1 100%; }
  .modal { padding: 14px; }
}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="telaLogin">
  <img src="https://raw.githubusercontent.com/NossoEventoRS/Imagens/refs/heads/main/Logo.png" height="100" alt="Logo">
  <h2>Painel Administrativo<br>| DANÇAS TRADICIONAIS |</h2>
  <input type="text" id="usuario" placeholder="Usuário" autocomplete="username">
  <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
  <div id="msgLogin"></div>
  <button class="btn" id="btnEntrar">ENTRAR</button>
</div>

<!-- ===================== PAINEL ===================== -->
<div id="app">
  <div class="topo">
    <img src="https://raw.githubusercontent.com/NossoEventoRS/Imagens/refs/heads/main/Logo.png" alt="Logo">
    <div class="titulo">
      <strong>MTG – MOVIMENTO TRADICIONALISTA GAÚCHO</strong><br>
      Nosso Evento RS<br>
      <strong>Painel Administrativo – Danças Tradicionais</strong>
    </div>
    <div class="usuario">
      <div>Olá, <b id="nomeUsuario"></b></div>
      <div><span class="selo" id="seloPermissao"></span></div>
      <button class="btn claro pequeno" id="btnSair">Sair</button>
    </div>
  </div>

  <div class="painel">
    <div class="barra">
      <select id="vista" aria-label="Aba da planilha"></select>
      <input type="text" class="busca" id="busca" placeholder="Buscar (nome, código, entidade, avaliador...)">
      <select id="filtroCategoria" aria-label="Filtrar por categoria" style="display:none"></select>
      <button class="btn claro" id="btnAtualizar">↻ Atualizar</button>
      <button class="btn" id="btnNovo" style="display:none">+ Novo candidato</button>
      <button class="btn" id="btnPdf">⬇ Gerar PDFs de avaliação</button>
    </div>
    <div class="barra"><span id="resumo"></span></div>

    <div class="tabela-wrap">
      <table>
        <thead id="cabTabela"></thead>
        <tbody id="corpoTabela"></tbody>
      </table>
    </div>
    <div class="mais"><button class="btn claro pequeno" id="btnMais" style="display:none">Mostrar mais linhas</button></div>
    <div class="aviso-corte" id="avisoCorte"></div>
  </div>
</div>

<!-- ===================== JANELA: VER / EDITAR ===================== -->
<div class="modal-fundo" id="modalEdicao">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="tituloEdicao">Editar</h2>
    <div class="grade" id="gradeCampos"></div>
    <div class="chk" id="boxPropagar" style="display:none">
      <input type="checkbox" id="propagar" checked>
      <label for="propagar">Atualizar também as avaliações já lançadas deste código (Interpretação, Correção e Harmonia)</label>
    </div>
    <div class="nota-modal" id="notaEdicao"></div>
    <div class="msg" id="msgEdicao"></div>
    <div class="rodape-modal">
      <button class="btn claro" id="btnFecharEdicao">Fechar</button>
      <button class="btn" id="btnSalvar">SALVAR ALTERAÇÕES</button>
    </div>
  </div>
</div>

<!-- ===================== JANELA: NOVO CANDIDATO ===================== -->
<div class="modal-fundo" id="modalNovo">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>Novo candidato</h2>
    <div class="grade">
      <div class="campo"><label for="n_codigo">Código</label><input id="n_codigo" maxlength="150"></div>
      <div class="campo inteiro"><label for="n_concorrente">Concorrente</label><input id="n_concorrente" maxlength="150"></div>
      <div class="campo"><label for="n_categoria">Categoria</label><select id="n_categoria"></select></div>
      <div class="campo"><label for="n_entidade">Entidade</label><input id="n_entidade" maxlength="150"></div>
      <div class="campo"><label for="n_municipio">Município</label><input id="n_municipio" maxlength="150"></div>
      <div class="campo"><label for="n_rt">RT</label><input id="n_rt" maxlength="150"></div>
    </div>
    <div class="msg" id="msgNovo"></div>
    <div class="rodape-modal">
      <button class="btn claro" id="btnFecharNovo">Cancelar</button>
      <button class="btn" id="btnCriarNovo">CRIAR CANDIDATO</button>
    </div>
  </div>
</div>

<!-- ===================== JANELA: PDFs ===================== -->
<div class="modal-fundo" id="modalPdf">
  <div class="modal" role="dialog" aria-modal="true" style="max-width:520px">
    <h2>Gerar PDFs de avaliação</h2>
    <div class="campo"><label for="p_quesito">Avaliação (quesito)</label><select id="p_quesito"></select></div>
    <div class="campo" style="margin-top:8px"><label for="p_categoria">Categoria</label><select id="p_categoria"></select></div>

    <label class="chk"><input type="checkbox" id="p_baixar" checked> <span>Baixar no meu dispositivo (um PDF, ou um arquivo .zip quando forem vários)</span></label>
    <label class="chk" id="boxDrive"><input type="checkbox" id="p_drive"> <span>Salvar também na pasta de PDFs do Drive</span></label>
    <label class="chk" id="boxSubstituir"><input type="checkbox" id="p_substituir"> <span>Substituir PDFs que já existem na pasta</span></label>
    <div class="nota-modal" id="notaPdf"></div>

    <div class="progresso" id="progresso"><div id="barra"></div></div>
    <div class="msg" id="msgPdf"></div>
    <div class="rodape-modal">
      <button class="btn claro" id="btnFecharPdf">Fechar</button>
      <button class="btn" id="btnGerarPdf">GERAR PDFs</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
// ===== CONFIGURAÇÃO =====
const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxEZXb8S1nRG3CLq6N4-D113_ry_nn9d8FuO6WGHhjO1L5zw4XV8TkNpzM-RC3dfrkDng/exec";
const LINHAS_POR_PAGINA = 200;
// ========================

const $ = id => document.getElementById(id);
const norm = s => String(s == null ? "" : s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const paraNumero = s => parseFloat(String(s).replace(",", "."));

let token = null;
let sessao = { usuario: "", nome: "", edita: false, pdf: true };
const podePdf = () => sessao.pdf !== false;
let info = { vistas: [], categorias: [], quesitos: [] };
let dados = null;          // resposta de adm_dados
let limite = LINHAS_POR_PAGINA;
let linhaAberta = null;    // linha em edição
let cancelarPdf = false;
let gerandoPdf = false;

/* ---------- Comunicação com o Google Script ---------- */
async function api(acao, extra) {
    const resp = await fetch(URL_SCRIPT, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },   // evita a pré-requisição CORS
        body: JSON.stringify(Object.assign({ acao: acao, token: token }, extra || {}))
    });
    let r;
    try { r = await resp.json(); }
    catch (e) { throw new Error("Resposta inválida do servidor. Confira a URL e se a implantação foi atualizada."); }
    if (r.sessaoExpirada) { sair(false); throw new Error(r.msg); }
    return r;
}

/* ---------- Login / sessão ---------- */
async function entrar() {
    $("msgLogin").textContent = "";
    const u = $("usuario").value.trim(), s = $("senha").value;
    if (!u || !s) { $("msgLogin").textContent = "Informe usuário e senha."; return; }

    $("btnEntrar").disabled = true;
    $("btnEntrar").textContent = "Verificando...";
    try {
        const r = await api("adm_login", { usuario: u, senha: s });
        if (r.status !== "OK") {
            $("msgLogin").textContent = r.msg === "Usuário não autorizado."
                ? "O painel ainda não está ativo no Google Script. Adicione o Admin.gs e atualize a implantação."
                : (r.msg || "Não foi possível entrar.");
            return;
        }
        token = r.token;
        sessao = { usuario: r.usuario, nome: r.nome, edita: !!r.edita, pdf: r.pdf !== false };
        try { sessionStorage.setItem("dt_sessao", JSON.stringify({ token: token, sessao: sessao })); } catch (e) {}
        $("senha").value = "";
        await abrirApp();
    } catch (err) {
        $("msgLogin").textContent = "Não foi possível conectar: " + err.message;
    } finally {
        $("btnEntrar").disabled = false;
        $("btnEntrar").textContent = "ENTRAR";
    }
}

async function abrirApp() {
    $("telaLogin").style.display = "none";
    $("app").style.display = "block";
    $("nomeUsuario").textContent = sessao.nome;
    const selo = $("seloPermissao");
    selo.textContent = !sessao.edita ? "Somente visualização" : (podePdf() ? "Edição liberada" : "Revisor (edição, sem PDFs)");
    selo.className = "selo " + (sessao.edita ? "edita" : "vista");
    $("btnPdf").style.display = podePdf() ? "" : "none";

    const r = await api("adm_vistas");
    if (r.status !== "OK") { $("resumo").textContent = r.msg; return; }
    info = r;
    montarSeletores();
    await carregarVista();
}

function sair(avisar) {
    if (avisar && token) { api("adm_sair").catch(() => {}); }
    token = null;
    dados = null;
    try { sessionStorage.removeItem("dt_sessao"); } catch (e) {}
    ["modalEdicao", "modalNovo", "modalPdf"].forEach(id => $(id).style.display = "none");
    $("app").style.display = "none";
    $("telaLogin").style.display = "block";
    $("corpoTabela").replaceChildren();
    $("cabTabela").replaceChildren();
}

/* ---------- Seletores ---------- */
function montarSeletores() {
    const sel = $("vista");
    sel.replaceChildren();
    const grupos = [
        ["Cadastro", n => n === "Candidatos"],
        ["Avaliações lançadas", n => n.indexOf("Avaliações") === 0],
        ["Classificação", n => n.indexOf("Classificação") === 0],
        ["Registro de alterações", n => n === "logs"]
    ];
    grupos.forEach(([titulo, teste]) => {
        const nomes = info.vistas.filter(teste);
        if (!nomes.length) return;
        const og = document.createElement("optgroup");
        og.label = titulo;
        nomes.forEach(n => og.appendChild(new Option(n, n)));
        sel.appendChild(og);
    });

    const q = $("p_quesito");
    q.replaceChildren();
    info.quesitos.forEach(n => q.appendChild(new Option(n, n)));

    const c = $("p_categoria");
    c.replaceChildren(new Option("Todas as categorias", "__TODAS__"));
    info.categorias.forEach(n => c.appendChild(new Option(n, n)));

    const nc = $("n_categoria");
    nc.replaceChildren();
    info.categorias.forEach(n => nc.appendChild(new Option(n, n)));
}

/* ---------- Carregar e mostrar uma aba ---------- */
async function carregarVista() {
    $("resumo").textContent = "Carregando...";
    $("btnMais").style.display = "none";
    try {
        const r = await api("adm_dados", { aba: $("vista").value });
        if (r.status !== "OK") { $("resumo").textContent = r.msg; return; }
        dados = r;
        limite = LINHAS_POR_PAGINA;
        montarFiltroCategoria();
        $("btnNovo").style.display = (sessao.edita && r.nome === "Candidatos") ? "" : "none";
        desenhar();
    } catch (err) {
        $("resumo").textContent = "Erro ao carregar: " + err.message;
    }
}

function indiceColuna(rotulo) { return dados.cabecalho.indexOf(rotulo); }

function montarFiltroCategoria() {
    const f = $("filtroCategoria");
    const idx = indiceColuna("Categoria");
    const mostrar = idx >= 0 && dados.nome.indexOf("Classificação") !== 0;
    f.style.display = mostrar ? "" : "none";
    f.replaceChildren(new Option("Todas as categorias", ""));
    if (mostrar) info.categorias.forEach(n => f.appendChild(new Option(n, n)));
}

function linhasFiltradas() {
    const termo = norm($("busca").value.trim());
    const cat = norm($("filtroCategoria").value);
    const iCat = indiceColuna("Categoria");
    let lista = dados.linhas.filter(l => {
        if (cat && iCat >= 0 && norm(l.v[iCat]) !== cat) return false;
        return !termo || norm(l.v.join(" ")).includes(termo);
    });
    if (dados.nome === "logs") lista = lista.slice().reverse();   // mais recentes primeiro
    return lista;
}

function podeAbrir() { return dados && (dados.tipo !== "leitura"); }

function desenhar() {
    const cab = $("cabTabela"), corpo = $("corpoTabela");
    cab.replaceChildren();
    corpo.replaceChildren();

    const trh = document.createElement("tr");
    if (podeAbrir()) { const th = document.createElement("th"); th.className = "acao"; th.textContent = "Ação"; trh.appendChild(th); }
    dados.cabecalho.forEach(t => { const th = document.createElement("th"); th.textContent = t; trh.appendChild(th); });
    cab.appendChild(trh);

    const lista = linhasFiltradas();
    lista.slice(0, limite).forEach(l => {
        const tr = document.createElement("tr");
        if (podeAbrir()) {
            const td = document.createElement("td");
            td.className = "acao";
            const b = document.createElement("button");
            b.className = "btn pequeno" + (sessao.edita ? "" : " claro");
            b.textContent = sessao.edita ? "Editar" : "Ver";
            b.onclick = () => abrirEdicao(l);
            td.appendChild(b);
            tr.appendChild(td);
        }
        l.v.forEach(c => {
            const td = document.createElement("td");
            td.textContent = c;                 // textContent: nada vindo da planilha é interpretado como HTML
            if (String(c).length > 60) td.className = "longo", td.title = c;
            tr.appendChild(td);
        });
        corpo.appendChild(tr);
    });

    $("resumo").textContent = (lista.length === dados.linhas.length
        ? `${dados.linhas.length} linha(s)` : `${lista.length} de ${dados.linhas.length} linha(s)`) + " – " + dados.nome;
    $("btnMais").style.display = lista.length > limite ? "" : "none";
    $("avisoCorte").textContent = dados.cortado ? "Mostrando apenas as linhas mais recentes desta aba." : "";
}

$("vista").addEventListener("change", carregarVista);
$("busca").addEventListener("input", () => { limite = LINHAS_POR_PAGINA; desenhar(); });
$("filtroCategoria").addEventListener("change", () => { limite = LINHAS_POR_PAGINA; desenhar(); });
$("btnAtualizar").addEventListener("click", carregarVista);
$("btnMais").addEventListener("click", () => { limite += LINHAS_POR_PAGINA; desenhar(); });
$("btnSair").addEventListener("click", () => sair(true));
$("btnEntrar").addEventListener("click", entrar);
["usuario", "senha"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") entrar(); }));

/* ---------- Ver / editar uma linha ---------- */
function abrirEdicao(linha) {
    linhaAberta = linha;
    const editaveis = new Map((dados.campos || []).map(c => [c.col, c]));
    const grade = $("gradeCampos");
    grade.replaceChildren();

    dados.cabecalho.forEach((rotulo, i) => {
        const col = i + 1;
        const valor = linha.v[i];
        const def = editaveis.get(col);
        const wrap = document.createElement("div");
        wrap.className = "campo" + ((def && def.tipo === "area") || String(valor).length > 45 ? " inteiro" : "") + (def ? " editavel" : "");
        const lab = document.createElement("label");
        lab.textContent = rotulo;
        wrap.appendChild(lab);

        if (!def) {
            const d = document.createElement("div");
            d.className = "leitura";
            d.textContent = valor;
            wrap.appendChild(d);
        } else {
            let el;
            if (def.tipo === "area") {
                el = document.createElement("textarea");
                el.maxLength = 3000;
                el.value = valor;
            } else if (def.tipo === "sel") {
                el = document.createElement("select");
                def.opcoes.forEach(o => el.appendChild(new Option(o, o)));
                const alvo = def.numerico
                    ? def.opcoes.find(o => Math.abs(paraNumero(o) - paraNumero(valor)) < 0.0005)
                    : def.opcoes.find(o => norm(o) === norm(valor));
                el.value = alvo !== undefined ? alvo : def.opcoes[0];
            } else {
                el = document.createElement("input");
                el.type = "text";
                el.value = valor;
                if (def.tipo === "num") el.inputMode = "decimal";
            }
            el.dataset.col = col;
            el.dataset.orig = valor;
            wrap.appendChild(el);
        }
        grade.appendChild(wrap);
    });

    const cand = dados.tipo === "candidatos";
    $("boxPropagar").style.display = (cand && sessao.edita) ? "flex" : "none";
    $("btnSalvar").style.display = sessao.edita ? "" : "none";
    $("btnFecharEdicao").textContent = sessao.edita ? "Cancelar" : "Fechar";
    $("tituloEdicao").textContent = (sessao.edita ? "Editar – " : "Consultar – ") + dados.nome + " (linha " + linha.n + ")";
    $("notaEdicao").textContent =
        !sessao.edita ? "Seu usuário tem permissão apenas de visualização."
        : dados.tipo === "interp" ? "Campos com ✎ podem ser alterados. Somas, média e nota final são recalculadas automaticamente, e a Classificação se atualiza sozinha."
        : dados.tipo === "harm" ? "Campos com ✎ podem ser alterados. O ganho de nota e a nota final são recalculados automaticamente."
        : dados.tipo === "corr" ? "Nesta aba só o parecer pode ser alterado aqui. Para mudar descontos, o avaliador reenvia a avaliação pelo formulário (a nova substitui a anterior)."
        : "Campos com ✎ podem ser alterados. Toda alteração fica registrada na aba logs.";
    $("msgEdicao").textContent = "";
    $("msgEdicao").className = "msg";
    $("modalEdicao").style.display = "flex";
}

function fecharEdicao() { $("modalEdicao").style.display = "none"; linhaAberta = null; }
$("btnFecharEdicao").addEventListener("click", fecharEdicao);

function mudou(el, def) {
    const a = el.value.trim(), b = String(el.dataset.orig).trim();
    if (def && (def.tipo === "num" || def.numerico)) return !(Math.abs(paraNumero(a) - paraNumero(b)) < 0.0005) || isNaN(paraNumero(a));
    return a !== b;
}

async function salvarEdicao() {
    if (!linhaAberta || !sessao.edita) return;
    const editaveis = new Map((dados.campos || []).map(c => [String(c.col), c]));
    const campos = {}, antes = {};
    $("gradeCampos").querySelectorAll("[data-col]").forEach(el => {
        const def = editaveis.get(el.dataset.col);
        if (mudou(el, def)) { campos[el.dataset.col] = el.value; antes[el.dataset.col] = el.dataset.orig; }
    });
    const msg = $("msgEdicao");
    if (!Object.keys(campos).length) { msg.className = "msg erro"; msg.textContent = "Nenhuma alteração para salvar."; return; }

    $("btnSalvar").disabled = true;
    $("btnSalvar").textContent = "Salvando...";
    try {
        const r = await api("adm_editar", {
            aba: dados.nome, linha: linhaAberta.n, campos: campos, antes: antes,
            propagar: dados.tipo === "candidatos" && $("propagar").checked
        });
        if (r.status !== "OK") { msg.className = "msg erro"; msg.textContent = r.msg; return; }
        fecharEdicao();
        await carregarVista();
    } catch (err) {
        msg.className = "msg erro";
        msg.textContent = "Erro ao salvar: " + err.message;
    } finally {
        $("btnSalvar").disabled = false;
        $("btnSalvar").textContent = "SALVAR ALTERAÇÕES";
    }
}
$("btnSalvar").addEventListener("click", salvarEdicao);

/* ---------- Novo candidato ---------- */
$("btnNovo").addEventListener("click", () => {
    ["n_codigo", "n_concorrente", "n_entidade", "n_municipio", "n_rt"].forEach(id => $(id).value = "");
    $("msgNovo").textContent = "";
    $("msgNovo").className = "msg";
    $("modalNovo").style.display = "flex";
});
$("btnFecharNovo").addEventListener("click", () => $("modalNovo").style.display = "none");
$("btnCriarNovo").addEventListener("click", async () => {
    const msg = $("msgNovo");
    const corpo = {
        codigo: $("n_codigo").value, concorrente: $("n_concorrente").value, categoria: $("n_categoria").value,
        entidade: $("n_entidade").value, municipio: $("n_municipio").value, rt: $("n_rt").value
    };
    if (Object.values(corpo).some(v => !String(v).trim())) { msg.className = "msg erro"; msg.textContent = "Preencha todos os campos."; return; }
    $("btnCriarNovo").disabled = true;
    try {
        const r = await api("adm_novo_candidato", corpo);
        if (r.status !== "OK") { msg.className = "msg erro"; msg.textContent = r.msg; return; }
        $("modalNovo").style.display = "none";
        await carregarVista();
    } catch (err) {
        msg.className = "msg erro"; msg.textContent = "Erro: " + err.message;
    } finally {
        $("btnCriarNovo").disabled = false;
    }
});

/* ---------- PDFs ---------- */
$("btnPdf").addEventListener("click", () => {
    if (gerandoPdf) { $("modalPdf").style.display = "flex"; return; }
    $("msgPdf").textContent = "";
    $("msgPdf").className = "msg";
    $("progresso").style.display = "none";
    $("barra").style.width = "0";
    $("p_drive").checked = false;
    $("p_substituir").checked = false;
    $("p_drive").disabled = !sessao.edita;
    $("boxDrive").classList.toggle("desab", !sessao.edita);
    $("notaPdf").textContent = sessao.edita ? "" : "Seu usuário pode baixar os PDFs, mas só quem tem edição liberada salva na pasta do Drive.";
    atualizarSubstituir();
    $("modalPdf").style.display = "flex";
});

function atualizarSubstituir() {
    const ok = sessao.edita && $("p_drive").checked;
    $("p_substituir").disabled = !ok;
    if (!ok) $("p_substituir").checked = false;
    $("boxSubstituir").classList.toggle("desab", !ok);
}
$("p_drive").addEventListener("change", atualizarSubstituir);
$("btnFecharPdf").addEventListener("click", () => {
    if (gerandoPdf) { cancelarPdf = true; $("msgPdf").textContent = "Cancelando após o lote atual..."; return; }
    $("modalPdf").style.display = "none";
});

function baixarBlob(blob, nome) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nome;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function base64ParaBlob(b64, tipo) {
    const bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return new Blob([u8], { type: tipo });
}
const limparNome = s => String(s).replace(/[\\/:*?"<>|\s]+/g, "_");

async function chamarComRepeticao(acao, corpo) {
    try { return await api(acao, corpo); }
    catch (e) { await new Promise(r => setTimeout(r, 1500)); return await api(acao, corpo); }   // uma nova tentativa
}

async function gerarPdfs() {
    const quesito = $("p_quesito").value, categoria = $("p_categoria").value;
    const baixar = $("p_baixar").checked;
    const drive = sessao.edita && $("p_drive").checked;
    const substituir = drive && $("p_substituir").checked;
    const msg = $("msgPdf");
    if (!baixar && !drive) { msg.className = "msg erro"; msg.textContent = "Marque pelo menos uma opção: baixar ou salvar no Drive."; return; }

    gerandoPdf = true;
    cancelarPdf = false;
    $("btnGerarPdf").disabled = true;
    $("btnFecharPdf").textContent = "Cancelar";
    $("progresso").style.display = "block";
    $("barra").style.width = "0";
    msg.className = "msg";
    msg.textContent = "Buscando as avaliações...";

    try {
        const lista = await api("adm_pdf_lista", { quesito: quesito, categoria: categoria, salvarDrive: drive });
        if (lista.status !== "OK") { msg.className = "msg erro"; msg.textContent = lista.msg; return; }
        const itens = lista.itens;
        if (!itens.length) { msg.textContent = "Nenhuma avaliação encontrada para essa escolha."; return; }

        const arquivos = [];
        const cont = { salvo: 0, ja: 0, subst: 0 };
        let pastaUrl = "";
        for (let i = 0; i < itens.length; i += lista.lote) {
            if (cancelarPdf) break;
            msg.textContent = `Gerando PDFs... ${Math.min(i + lista.lote, itens.length)} de ${itens.length}\nNão feche esta janela.`;
            const r = await chamarComRepeticao("adm_pdf_lote", {
                quesito: quesito, linhas: itens.slice(i, i + lista.lote).map(x => x.linha),
                salvarDrive: drive, substituir: substituir
            });
            if (r.status !== "OK") { msg.className = "msg erro"; msg.textContent = "Erro: " + r.msg; break; }
            r.arquivos.forEach(a => {
                arquivos.push(a);
                if (a.drive === "salvo") cont.salvo++; else if (a.drive === "já existia") cont.ja++; else if (a.drive === "substituído") cont.subst++;
            });
            if (r.pasta) pastaUrl = r.pasta;
            $("barra").style.width = Math.round(Math.min(i + lista.lote, itens.length) / itens.length * 100) + "%";
        }

        if (!arquivos.length) { if (msg.className.indexOf("erro") < 0) msg.textContent = "Nenhum PDF foi gerado."; return; }

        let resumo = `${arquivos.length} PDF(s) gerado(s)` + (cancelarPdf ? " (cancelado antes de terminar)" : "") + ".";
        if (baixar) {
            if (arquivos.length === 1) {
                baixarBlob(base64ParaBlob(arquivos[0].base64, "application/pdf"), arquivos[0].nome);
                resumo += "\nDownload iniciado: " + arquivos[0].nome;
            } else {
                msg.textContent = "Compactando os arquivos...";
                const zip = new JSZip();
                arquivos.forEach(a => zip.file(a.nome, a.base64, { base64: true }));
                const blob = await zip.generateAsync({ type: "blob" });
                const nomeZip = limparNome(quesito + "_" + (categoria === "__TODAS__" ? "Todas" : categoria) + "_" + new Date().toISOString().slice(0, 10)) + ".zip";
                baixarBlob(blob, nomeZip);
                resumo += "\nDownload iniciado: " + nomeZip;
            }
        }
        if (drive) resumo += `\nPasta do Drive: ${cont.salvo} salvo(s), ${cont.subst} substituído(s), ${cont.ja} já existia(m).`;
        msg.className = "msg ok";
        msg.textContent = resumo;
        if (drive && /^https:\/\/drive\.google\.com\//.test(pastaUrl)) {
            const a = document.createElement("a");
            a.href = pastaUrl; a.target = "_blank"; a.rel = "noopener";
            a.textContent = "\nAbrir a pasta no Drive";
            a.style.display = "block";
            msg.appendChild(a);
        }
        if (!cancelarPdf) carregarVista();   // atualiza a aba logs se estiver aberta
    } catch (err) {
        msg.className = "msg erro";
        msg.textContent = "Erro ao gerar PDFs: " + err.message;
    } finally {
        gerandoPdf = false;
        $("btnGerarPdf").disabled = false;
        $("btnFecharPdf").textContent = "Fechar";
    }
}
$("btnGerarPdf").addEventListener("click", gerarPdfs);

/* ---------- Retomar sessão ao recarregar a página ---------- */
(async function retomar() {
    try {
        const salvo = JSON.parse(sessionStorage.getItem("dt_sessao") || "null");
        if (salvo && salvo.token) {
            token = salvo.token;
            sessao = salvo.sessao;
            await abrirApp();
        }
    } catch (e) { sair(false); }
})();
</script>
